spring:
  application:
    name: simple-money-transfers
  datasource:
    url: "jdbc:h2:mem:money;MODE=PostgreSQL;DB_CLOSE_DELAY=-1"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    clean-disabled: true

app:
  security:
    api-keys:
      - id: test-client
        key: test-api-key-that-is-at-least-32-characters-long

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
