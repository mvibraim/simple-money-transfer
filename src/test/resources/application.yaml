spring:
  application:
    name: simple-money-transfers
  datasource:
    url: "jdbc:h2:mem:money;MODE=PostgreSQL;DB_CLOSE_DELAY=-1"
    hikari:
      # Comfortably above F15's largest concurrency scenario (64 threads),
      # so a queued-connection timeout never masquerades as a concurrency bug.
      maximum-pool-size: 80
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    clean-disabled: true
    locations: classpath:db/migration/common,classpath:db/migration/{vendor}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      use-big-decimal-for-floats: true
  mvc:
    problemdetails:
      enabled: true

springdoc:
  # This file, not src/main/resources/application.yaml, is what a
  # @SpringBootTest loads (classpath lookup only finds the first
  # application.yaml, and test resources precede main on the test
  # classpath) - so this has to be repeated here, not just in main's.
  # Without it, OpenApiContractIT would also pick up test-only
  # controllers like exception/ProbeController via full-context
  # component scanning.
  packages-to-scan: com.example.simple_money_transfers.controller

app:
  security:
    api-keys:
      - id: test-client
        key: test-api-key-that-is-at-least-32-characters-long

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
