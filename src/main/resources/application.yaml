spring:
  application:
    name: simple-money-transfers
  datasource:
    # No defaults: a missing secret must fail startup, not run silently.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    clean-disabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      use-big-decimal-for-floats: true

app:
  security:
    api-keys:
      - id: ${API_CLIENT_ID}
        key: ${API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
