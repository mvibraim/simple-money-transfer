name: Claude Code Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            This is simple-money-transfers, a Spring Boot 4.1 / Spring Framework 7
            money-movement service on the Java 25 toolchain. Review this pull
            request with a focus on:
            - Ledger correctness: double-entry balance, no lost or duplicated movements
            - Concurrency: safe behavior under concurrent transfers on the same account
            - Idempotency: repeated requests must not double-apply a transfer
            - Money handling: no floating-point currency arithmetic, correct rounding
            - General code quality, bugs, and security implications
            - Conformance with this repo's CLAUDE.md conventions (Boot 4.1/Framework 7
              starter names, Jackson 3, JSpecify nullability, ProblemDetail error
              responses, virtual threads, testing conventions)

            Note: The PR branch is already checked out in the current working directory.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`)
            to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
