services:
  app:
    image: simple-money-transfers:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # postgres, not localhost: inside the compose network the app
      # reaches the database container by its service name, unlike
      # bootRun on the host (F02's .env.example), which uses localhost
      # via Postgres's published port.
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-money}"
      SPRING_DATASOURCE_USERNAME: money_app
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD must be set — copy .env.example to .env and fill it in}
      SPRING_FLYWAY_USER: ${SPRING_FLYWAY_USER:?SPRING_FLYWAY_USER must be set}
      SPRING_FLYWAY_PASSWORD: ${SPRING_FLYWAY_PASSWORD:?SPRING_FLYWAY_PASSWORD must be set}
      API_CLIENT_ID: ${API_CLIENT_ID:?API_CLIENT_ID must be set}
      API_KEY: ${API_KEY:?API_KEY must be set}
      # JEP 519, off by default on the JDK 25 toolchain (CLAUDE.md's Java 25
      # toolchain section) - the JVM picks this up directly, independent of
      # how the image itself was built.
      JAVA_TOOL_OPTIONS: "-XX:+UseCompactObjectHeaders"
    ports:
      - "8080:8080"
