services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-money}
      POSTGRES_USER: ${POSTGRES_USER:-money}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — copy .env.example to .env and fill it in}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-money} -d ${POSTGRES_DB:-money}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      # Postgres 18's image moved PGDATA to a version-scoped subdirectory
      # (/var/lib/postgresql/18/docker); the declared VOLUME is the parent.
      # Mounting .../data here binds nothing and data silently vanishes on
      # `compose down`.
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
