services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: simple-money-transfers:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # postgres, not localhost: inside the compose network the app
      # reaches the database container by its service name, unlike
      # bootRun on the host (.env.example), which uses localhost via
      # Postgres's published port.
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-money}"
      SPRING_DATASOURCE_USERNAME: money_app
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD must be set — copy .env.example to .env and fill it in}
      SPRING_FLYWAY_USER: ${SPRING_FLYWAY_USER:?SPRING_FLYWAY_USER must be set}
      SPRING_FLYWAY_PASSWORD: ${SPRING_FLYWAY_PASSWORD:?SPRING_FLYWAY_PASSWORD must be set}
      API_CLIENT_ID: ${API_CLIENT_ID:?API_CLIENT_ID must be set}
      API_KEY: ${API_KEY:?API_KEY must be set}
    ports:
      - "8080:8080"
    # Longer than Boot 4.1.1's default 30s graceful-shutdown drain
    # (server.shutdown=graceful) - otherwise Docker SIGKILLs in-flight
    # transfers mid-drain on every `compose down`/`compose stop`.
    stop_grace_period: 40s
    healthcheck:
      # /actuator/health needs no X-API-Key (SecurityConfig permits it
      # explicitly) - only the exact path, not /actuator/health/**.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-money}
      POSTGRES_USER: ${POSTGRES_USER:-money}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — copy .env.example to .env and fill it in}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    command:
      # Required together, not individually (F16): pessimistic locking
      # (F09) turns one stuck transaction into held row locks, and without
      # these a slow transaction can block others indefinitely rather than
      # failing fast with a 503 the client can retry.
      - "postgres"
      - "-c"
      - "lock_timeout=3000"
      - "-c"
      - "statement_timeout=15000"
      - "-c"
      - "idle_in_transaction_session_timeout=60000"
      # The highest-value pair for actually finding concurrency bugs in
      # dev: every lock wait past 200ms is logged with the blocking PID
      # and statement.
      - "-c"
      - "deadlock_timeout=200ms"
      - "-c"
      - "log_lock_waits=on"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-money} -d ${POSTGRES_DB:-money}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      # Postgres 18's image moved PGDATA to a version-scoped subdirectory
      # (/var/lib/postgresql/18/docker); the declared VOLUME is the parent.
      # Mounting .../data here binds nothing and data silently vanishes on
      # `compose down`.
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
